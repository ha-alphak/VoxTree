name: Sensitive content guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sensitive-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            ./scripts/check-sensitive-content.sh range "$AFTER"
          else
            ./scripts/check-sensitive-content.sh range "$BEFORE..$AFTER"
          fi

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-sensitive-content.sh range "$BASE..$HEAD"
