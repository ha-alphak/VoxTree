name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / MSVC / ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - debug
          - release
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure, build, and test
        shell: pwsh
        run: ./scripts/Invoke-Build.ps1 -Preset windows-msvc-${{ matrix.configuration }}

  debian:
    name: Debian 13 / GCC / ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - debug
          - release
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            libsqlite3-dev \
            libudev-dev \
            ninja-build

      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure, build, and test
        run: ./scripts/build.sh linux-gcc-${{ matrix.configuration }}

  analysis:
    name: Debian 13 / Clang analysis
    runs-on: ubuntu-24.04
    container: debian:13.6-slim
    steps:
      - name: Install analysis tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            ca-certificates \
            clang \
            clang-format \
            clang-tidy \
            cmake \
            doxygen \
            g++ \
            libsqlite3-dev \
            libudev-dev \
            ninja-build

      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check formatting
        run: |
          find apps libs tests -type f \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.hpp.in' -o -name '*.h' \) \
            -print0 |
            xargs --null clang-format --dry-run --Werror

      - name: Build API documentation
        run: ./scripts/build.sh linux-documentation

      - name: Configure, analyze, build, and test
        run: ./scripts/build.sh linux-clang-analysis
